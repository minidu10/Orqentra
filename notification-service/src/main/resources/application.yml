server:
  port: 8085

spring:
  application:
    name: orqentra-notification-service
  kafka:
    listener:
      # Makes each listener a child of the producing span, using the traceparent header.
      observation-enabled: true
    template:
      observation-enabled: true
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapping the Jackson deserializer keeps a bad payload from killing the container.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: "com.orqentra.*"
        spring.json.type.mapping: "orderCreated:com.orqentra.notification.events.OrderCreatedEvent,stockReserved:com.orqentra.notification.events.StockReservedEvent,stockRejected:com.orqentra.notification.events.StockRejectedEvent,paymentSucceeded:com.orqentra.notification.events.PaymentSucceededEvent,paymentFailed:com.orqentra.notification.events.PaymentFailedEvent,stockReleaseRequested:com.orqentra.notification.events.StockReleaseRequestedEvent"

orqentra:
  jwt:
    secret: ${ORQENTRA_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
  stream:
    # Long enough that a browser tab left open does not churn through reconnects.
    timeout: PT30M
    heartbeat-interval: PT20S

management:
  endpoints:
    web:
      exposure:
        # Prometheus has no JWT, so these are reachable without one. In a real deployment
        # the actuator would be bound to a separate management port on an internal
        # network and never routed through the public gateway.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Micrometer publishes only a summary unless this is on, and histogram_quantile
      # needs the buckets. Without it the latency panel is permanently empty.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # 100% for development. Lower it in production; the rate is configuration.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [%X{requestId:-no-request-id}]"
  level:
    com.orqentra.notification: info
