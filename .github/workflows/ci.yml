name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch/PR cancels whatever CI run was already in flight for it,
# so pushing twice in a row does not pay for two full runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each backend service builds and tests independently, in parallel: that is what "no
  # parent/aggregator POM" means in practice, and it is also what keeps the whole
  # workflow well under ten minutes instead of running four suites back to back.
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - inventory-service
          - payment-service
          - order-service
          - notification-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      # Testcontainers needs a Docker daemon; GitHub-hosted ubuntu runners ship one
      # already, so there is nothing to install here.
      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  # The saga tests are their own module because they exercise all three services as
  # separately deployed processes rather than through any one service's own test
  # classpath — see e2e-tests/pom.xml for why.
  e2e:
    name: end-to-end saga
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package the saga services
        run: |
          for service in inventory-service payment-service order-service; do
            (cd "$service" && ./mvnw --batch-mode --no-transfer-progress -DskipTests package)
          done

      - name: Run the end-to-end saga tests
        working-directory: e2e-tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: e2e-tests/target/*-e2e.log
          retention-days: 7
          if-no-files-found: ignore

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
