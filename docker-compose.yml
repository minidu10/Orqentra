services:
  order-db:
    image: postgres:16
    container_name: orqentra-order-db
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orqentra
      POSTGRES_PASSWORD: orqentra
    ports:
      # 5432 and 5433 are taken by the native PostgreSQL 17 and 18 installs on this machine
      - "5434:5432"
    volumes:
      - orderdata:/var/lib/postgresql/data

  inventory-db:
    image: postgres:16
    container_name: orqentra-inventory-db
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: orqentra
      POSTGRES_PASSWORD: orqentra
    ports:
      - "5435:5432"
    volumes:
      - inventorydata:/var/lib/postgresql/data

  payment-db:
    image: postgres:16
    container_name: orqentra-payment-db
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: orqentra
      POSTGRES_PASSWORD: orqentra
    ports:
      - "5436:5432"
    volumes:
      - paymentdata:/var/lib/postgresql/data

  auth-db:
    image: postgres:16
    container_name: orqentra-auth-db
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: orqentra
      POSTGRES_PASSWORD: orqentra
    ports:
      - "5437:5432"
    volumes:
      - authdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: orqentra-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: orqentra-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      # Two listeners: containers on this network reach the broker as redpanda:29092,
      # while apps on the host reach it as localhost:9092.
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - redpandadata:/var/lib/redpanda/data

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: orqentra-redpanda-console
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      # The console listens on 8080 internally, which the order service already owns here.
      - "8090:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: orqentra-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: orqentra-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: orqentra-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.2
    container_name: orqentra-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      # 3001, not 3000: the React dev server may want 3000.
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  orderdata:
  inventorydata:
  redpandadata:
  paymentdata:
  authdata:
  redisdata:
  prometheusdata:
  grafanadata:
