apiVersion: 1

providers:
  - name: Orqentra
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # Checked into the repository, so the dashboard survives docker compose down -v.
      path: /etc/grafana/provisioning/dashboards
