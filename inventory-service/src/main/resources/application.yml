server:
  port: 8081

spring:
  application:
    name: orqentra-inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5435/inventory
    username: orqentra
    password: orqentra
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # The records are duplicated per service, so the wire carries a logical
        # type name instead of a package-qualified class name.
        spring.json.type.mapping: "orderCreated:com.orqentra.inventory.events.OrderCreatedEvent,stockReserved:com.orqentra.inventory.events.StockReservedEvent,stockRejected:com.orqentra.inventory.events.StockRejectedEvent,paymentSucceeded:com.orqentra.inventory.events.PaymentSucceededEvent,paymentFailed:com.orqentra.inventory.events.PaymentFailedEvent,stockReleaseRequested:com.orqentra.inventory.events.StockReleaseRequestedEvent"
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapping the Jackson deserializer means a bad payload surfaces as a failed
      # record the error handler can route to the DLQ, instead of an exception the
      # container cannot recover from.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: "com.orqentra.*"
        spring.json.type.mapping: "orderCreated:com.orqentra.inventory.events.OrderCreatedEvent,stockReserved:com.orqentra.inventory.events.StockReservedEvent,stockRejected:com.orqentra.inventory.events.StockRejectedEvent,paymentSucceeded:com.orqentra.inventory.events.PaymentSucceededEvent,paymentFailed:com.orqentra.inventory.events.PaymentFailedEvent,stockReleaseRequested:com.orqentra.inventory.events.StockReleaseRequestedEvent"

orqentra:
  jwt:
    # Verified locally in every service. A shared symmetric secret is a deliberate
    # simplification for this phase; production would sign asymmetrically and publish a
    # JWKS endpoint so only the auth service holds the private key.
    secret: ${ORQENTRA_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}

logging:
  pattern:
    level: "%5p [%X{requestId:-no-request-id}]"
  level:
    org.hibernate.SQL: debug
