server:
  port: 8080

spring:
  application:
    name: orqentra-api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

orqentra:
  jwt:
    # Same property name and secret as every service. The gateway verifies locally too;
    # it does not call the auth service to check a token.
    secret: ${ORQENTRA_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}

  gateway:
    # Longest matching prefix wins, so /api/admin resolves before a shorter /api rule.
    # Base URLs are configuration, not literals, so they can be pointed at container
    # hostnames later without touching code.
    routes:
      "[/api/auth]": ${AUTH_SERVICE_URL:http://localhost:8083}
      "[/api/orders]": ${ORDER_SERVICE_URL:http://localhost:8084}
      "[/api/products]": ${ORDER_SERVICE_URL:http://localhost:8084}
      "[/api/admin]": ${ORDER_SERVICE_URL:http://localhost:8084}
      "[/api/inventory]": ${INVENTORY_SERVICE_URL:http://localhost:8081}
      "[/api/payments]": ${PAYMENT_SERVICE_URL:http://localhost:8082}
      "[/api/notifications]": ${NOTIFICATION_SERVICE_URL:http://localhost:8085}

    cors:
      allowed-origins:
        - ${UI_ORIGIN_VITE:http://localhost:5173}
        - ${UI_ORIGIN_CRA:http://localhost:3000}
      max-age: PT30M

    rate-limit:
      # ~5 requests a second with a burst of 10, low enough to demonstrate by hand.
      replenish-rate: 5
      burst-capacity: 10

management:
  endpoints:
    web:
      exposure:
        # Prometheus has no JWT, so these are reachable without one. In a real deployment
        # the actuator would be bound to a separate management port on an internal
        # network and never routed through the public gateway.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Micrometer publishes only a summary unless this is on, and histogram_quantile
      # needs the buckets. Without it the latency panel is permanently empty.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # 100% for development. Lower it in production; the rate is configuration.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.orqentra.gateway: info
