server:
  port: 8080

spring:
  application:
    name: orqentra-order-service
  datasource:
    url: jdbc:postgresql://localhost:5434/orders
    username: orqentra
    password: orqentra
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # The records are duplicated per service, so the wire carries a logical
        # type name instead of a package-qualified class name.
        spring.json.type.mapping: "orderCreated:com.orqentra.order.events.OrderCreatedEvent,stockReserved:com.orqentra.order.events.StockReservedEvent,stockRejected:com.orqentra.order.events.StockRejectedEvent"
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.orqentra.*"
        spring.json.type.mapping: "orderCreated:com.orqentra.order.events.OrderCreatedEvent,stockReserved:com.orqentra.order.events.StockReservedEvent,stockRejected:com.orqentra.order.events.StockRejectedEvent"

logging:
  level:
    org.hibernate.SQL: debug