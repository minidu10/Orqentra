server:
  port: 8084

spring:
  application:
    name: orqentra-order-service
  datasource:
    url: jdbc:postgresql://localhost:5434/orders
    username: orqentra
    password: orqentra
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    listener:
      # Makes each listener a child of the producing span, using the traceparent header.
      observation-enabled: true
    template:
      observation-enabled: true
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # The records are duplicated per service, so the wire carries a logical
        # type name instead of a package-qualified class name.
        spring.json.type.mapping: "orderCreated:com.orqentra.order.events.OrderCreatedEvent,stockReserved:com.orqentra.order.events.StockReservedEvent,stockRejected:com.orqentra.order.events.StockRejectedEvent,paymentSucceeded:com.orqentra.order.events.PaymentSucceededEvent,paymentFailed:com.orqentra.order.events.PaymentFailedEvent,stockReleaseRequested:com.orqentra.order.events.StockReleaseRequestedEvent"
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapping the Jackson deserializer means a bad payload surfaces as a failed
      # record the error handler can route to the DLQ, instead of an exception the
      # container cannot recover from.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: "com.orqentra.*"
        spring.json.type.mapping: "orderCreated:com.orqentra.order.events.OrderCreatedEvent,stockReserved:com.orqentra.order.events.StockReservedEvent,stockRejected:com.orqentra.order.events.StockRejectedEvent,paymentSucceeded:com.orqentra.order.events.PaymentSucceededEvent,paymentFailed:com.orqentra.order.events.PaymentFailedEvent,stockReleaseRequested:com.orqentra.order.events.StockReleaseRequestedEvent"

orders:
  # A saga sitting in a non-terminal state longer than this is reported as stuck.
  stuck-after: PT2M

orqentra:
  jwt:
    # Verified locally in every service. A shared symmetric secret is a deliberate
    # simplification for this phase; production would sign asymmetrically and publish a
    # JWKS endpoint so only the auth service holds the private key.
    secret: ${ORQENTRA_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}

management:
  endpoints:
    web:
      exposure:
        # Prometheus has no JWT, so these are reachable without one. In a real deployment
        # the actuator would be bound to a separate management port on an internal
        # network and never routed through the public gateway.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Micrometer publishes only a summary unless this is on, and histogram_quantile
      # needs the buckets. Without it the latency panel is permanently empty.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # 100% for development. Lower it in production; the rate is configuration.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [%X{requestId:-no-request-id}]"
  level:
    org.hibernate.SQL: debug